name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install MinGW-w64 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add x86_64-pc-windows-gnu

      - name: Run tests
        run: cargo test --locked

      - name: Build AnomalyLauncher.exe
        run: cargo build --release --locked --target x86_64-pc-windows-gnu

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: AnomalyLauncher
          path: target/x86_64-pc-windows-gnu/release/AnomalyLauncher.exe

      - name: Publish GitHub release
        # Tag pushes publish that tag. Pushes to main publish v<major>.<minor> from
        # Cargo.toml, creating the tag, if that release doesn't exist yet.
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXE=target/x86_64-pc-windows-gnu/release/AnomalyLauncher.exe
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
            TAG="v$(echo "$VERSION" | cut -d. -f1,2)"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              gh release upload "$TAG" "$EXE" --clobber
            else
              echo "Release $TAG already exists; bump the version in Cargo.toml to publish a new one."
            fi
          else
            gh release create "$TAG" "$EXE" \
              --target "$GITHUB_SHA" \
              --title "AnomalyLauncherRust-$TAG" \
              --notes-file .github/release-notes.md
          fi
